{% extends "base.html" %}{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="caixa" style="max-width:380px;margin:60px auto">
  <h1>🦷 Entrar</h1>
  <p class="sub">{{ config.NOME_CLINICA }}</p>
  <form method="post" action="/entrar">
    <input type="hidden" name="voltar" value="{{ voltar }}">
    <div style="margin-bottom:12px"><label>Usuário</label><input name="login" autofocus autocomplete="username" required></div>
    <div style="margin-bottom:16px"><label>Senha</label><input name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</div>
{% endblock %}
